    - data:
        instruction: '从用户消息中提取售后订单号、售后处理方式、问题类型和售后原因。


          要求：


          1. order_no

          - 提取用户明确提供的订单号。

          - 如果没有订单号，返回空字符串。

          - 不要猜测或编造订单号。


          2. request_type

          表示用户希望采取的售后处理方式，只能返回以下值之一：

          - return：退货

          - refund：退款

          - exchange：换货

          - reship：补发

          - other：其他或用户未明确说明


          判断示例：

          “我想退货” → return

          “我要退款” → refund

          “帮我换一个” → exchange

          “少发了，请补发” → reship

          “我要申请售后” → other


          3. issue_type

          表示用户遇到的商品或履约问题，只能返回以下值之一：

          - damaged：商品破损、损坏

          - missing：少件、漏发

          - wrong_item：发错商品

          - quality：质量问题、无法正常使用等

          - no_issue：用户没有描述商品问题，例如单纯不想要了、想退货

          - other：其他无法归类的问题


          4. after_sale_reason

          - 用简洁中文保留用户实际表达的核心售后原因。

          - 不要添加用户没有说过的信息。

          - 如果原因不明确，返回用户已有的售后诉求，例如“申请售后”。


          5. 不要因为用户提到问题类型，就擅自推测处理方式。

          例如：

          “商品坏了”只能判断 issue_type=damaged，

          如果用户没有说退货、退款、换货，则 request_type=other。


          6. 不要因为用户提出处理方式，就擅自推测商品问题。

          例如：

          “我想退货”应为 request_type=return，

          如果没有说明原因，则 issue_type=no_issue。'
