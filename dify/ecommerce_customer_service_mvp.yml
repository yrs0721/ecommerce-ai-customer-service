        - description: 用户提供的具体订单号。如果用户没有提供订单号，则返回空字符串。
          name: order_no
          required: false
          type: string
        - description: 用户提出售后的具体原因，例如商品损坏、质量问题、少件、发错货、想退货等。如果没有明确说明，则返回空字符串。
