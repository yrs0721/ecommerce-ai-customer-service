    - data:
        code: "\nimport re\n\ndef main(input_str: str) -> dict:\n    # 1. 清除 <think>...</think>\
          \ 标签及其内部的思考过程\n    clean_text = re.sub(r'<think>.*?</think>', '', input_str,\
          \ flags=re.DOTALL)\n    # 2. 清除未闭合的 <think> 开头文本\n    clean_text = re.sub(r'^<think>.*',\
          \ '', clean_text, flags=re.DOTALL)\n    \n    # 3. 提取所有长度在 6 到 30 之间的字母数字组合\n\
          \    candidates = re.findall(r'[A-Za-z0-9]{6,30}', clean_text)\n    \n \
          \   # 4. 遍历候选词，优先寻找“必须包含数字”的字符串（排除单纯的英文单词）\n    order_no = \"NONE\"\n  \
          \  for item in candidates:\n        if any(char.isdigit() for char in item):\n\
          \            order_no = item\n            break\n            \n    return\
          \ {\n        \"order_no\": order_no\n    }"
        code_language: python3
        outputs:
